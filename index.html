<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI 자이언츠 챕터 · 디지털 명함</title>
<meta property="og:title" content="BNI 자이언츠 챕터 · 디지털 명함">
<meta property="og:description" content="BNI 자이언츠 챕터 멤버 디지털 명함 모음 · 부산">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#080808;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.badge{background:#C8102E;color:#fff;font-size:11px;font-weight:800;padding:5px 14px;border-radius:3px;letter-spacing:2px;margin-bottom:24px}
h1{font-size:28px;font-weight:900;margin-bottom:6px;text-align:center}
.sub{font-size:13px;color:rgba(255,255,255,0.35);margin-bottom:48px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:400px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:20px 16px;text-decoration:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;transition:all 0.2s}
.card:hover{border-color:#b89a3a;background:rgba(184,154,58,0.07)}
.card-photo{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(184,154,58,0.3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px}
.card-photo img{width:100%;height:100%;object-fit:cover;object-position:center top}
.card-name{font-size:15px;font-weight:800;text-align:center}
.card-job{font-size:11px;color:rgba(255,255,255,0.35);text-align:center;line-height:1.5}
.card-gold{font-size:10px;color:#b89a3a;font-weight:700;margin-top:2px}
.add-card{border-style:dashed;border-color:rgba(255,255,255,0.1)}
.add-card:hover{border-color:rgba(184,154,58,0.4)}
.add-icon{font-size:28px;color:rgba(255,255,255,0.15)}
.add-txt{font-size:12px;color:rgba(255,255,255,0.2);text-align:center}
footer{margin-top:48px;font-size:11px;color:rgba(255,255,255,0.15);letter-spacing:1px}
</style>
</head>
<body>
<div class="badge">BNI</div>
<h1>자이언츠 챕터</h1>
<p class="sub">Giants Chapter · Busan · 디지털 명함</p>

<div class="grid">
  <!-- 김준래 -->
  <a class="card" href="김준래/">
    <div class="card-photo">
      <img src="김준래/profile.jpg" alt="김준래" onerror="this.parentNode.innerHTML='👤'">
    </div>
    <div class="card-name">김준래</div>
    <div class="card-job">무늬디자인<br>인테리어 전문</div>
    <div class="card-gold">3기 도어퍼슨마스터</div>
  </a>

  <!-- 멤버 추가 자리 -->
  <a class="card add-card" href="#">
    <div class="card-photo"><span class="add-icon">+</span></div>
    <div class="add-txt">멤버 명함<br>추가 예정</div>
  </a>
</div>

<footer>BNI Giants Chapter · Busan · 2026</footer>
</body>
</html>
