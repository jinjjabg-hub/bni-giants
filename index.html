<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BNI 자이언츠 챕터 | 멤버 카드</title>
<meta property="og:image" content="https://jinjjabg-hub.github.io/bni-giants/og_giants.jpg">
<meta name="description" content="BNI 자이언츠 챕터 디지털 명함 모음">
<meta property="og:title" content="BNI 자이언츠 챕터 | 멤버 카드">
<meta property="og:description" content="BNI 자이언츠 챕터 디지털 명함 모음">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy:  #0d1f3c;
  --navy2: #152844;
  --navy3: #1a3056;
  --red:   #ef314f;
  --gold:  #cca132;
  --white: #ffffff;
  --cream: #faf8f4;
  --line:  rgba(255,255,255,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  font-family:'Noto Sans KR',sans-serif;
  background:var(--navy);
  color:var(--white);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  max-width:480px;
  margin:0 auto;
}

/* 헤더 */
.header {
  padding:52px 20px 32px;
  text-align:center;
  background:linear-gradient(180deg, var(--navy2) 0%, var(--navy) 100%);
  border-bottom:1px solid var(--line);
}
.chapter-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--red); color:#fff;
  font-size:11px; font-weight:700;
  padding:5px 14px; border-radius:20px;
  margin-bottom:16px; letter-spacing:0.5px;
}
.header-title {
  font-size:26px; font-weight:900;
  color:var(--white); letter-spacing:2px;
  margin-bottom:6px;
}
.header-sub {
  font-size:13px; color:rgba(255,255,255,.45);
  letter-spacing:1px;
}
.gold-line {
  width:40px; height:2px;
  background:var(--gold);
  margin:16px auto 0;
  border-radius:2px;
}

/* 멤버 리스트 */
.member-list {
  padding:24px 16px 48px;
  display:flex; flex-direction:column; gap:12px;
}

/* 멤버 카드 */
.member-card {
  display:flex; align-items:center; gap:14px;
  background:var(--navy2);
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  padding:16px;
  text-decoration:none; color:var(--white);
  transition:all .2s;
  position:relative; overflow:hidden;
}
.member-card::after {
  content:'›';
  position:absolute; right:16px; top:50%;
  transform:translateY(-50%);
  font-size:20px; color:rgba(255,255,255,.3);
}
.member-card:active { background:var(--navy3); transform:scale(.98); }

/* 아바타 */
.avatar {
  width:56px; height:56px; border-radius:50%;
  object-fit:cover; object-position:top;
  border:2px solid var(--gold);
  flex-shrink:0; background:var(--navy3);
}
.avatar-placeholder {
  width:56px; height:56px; border-radius:50%;
  background:var(--navy3);
  border:2px solid rgba(204,161,50,.4);
  flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:900; color:var(--gold);
}

/* 멤버 정보 */
.member-info { flex:1; min-width:0; padding-right:24px; }
.member-name {
  font-size:17px; font-weight:700;
  color:var(--white); margin-bottom:3px; letter-spacing:1px;
}
.member-company {
  font-size:12px; color:rgba(255,255,255,.5);
  margin-bottom:8px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.member-tags { display:flex; flex-wrap:wrap; gap:5px; }
.member-tag {
  background:rgba(204,161,50,.12);
  border:1px solid rgba(204,161,50,.3);
  color:var(--gold);
  font-size:10px; font-weight:500;
  padding:3px 9px; border-radius:20px;
}
.member-tag.red {
  background:rgba(239,49,79,.12);
  border-color:rgba(239,49,79,.3);
  color:#ef8fa0;
}

/* 카운트 */
.member-count {
  text-align:center; padding-top:8px;
  font-size:11px; color:rgba(255,255,255,.25);
  letter-spacing:1px;
}

/* 푸터 */
footer {
  text-align:center; padding:24px 20px 40px;
  border-top:1px solid var(--line);
}
footer p { font-size:11px; color:rgba(255,255,255,.25); line-height:1.8; }
footer strong { color:var(--gold); }
</style>
</head>
<body>

</div>

    <div class="member-name">박성준 대표</div>
    <div class="member-company">엘로이미디어 | 방송장비</div>
    <div class="member-tags">
      <span class="member-tag">방송장비</span>
      <span class="member-tag">미디어</span>
    </div>

  <!-- 정율채 -->

         onerror="this.outerHTML='<div class=\'avatar-placeholder\'>정</div>'">

      <div class="member-company">K-VISA센터 행정사사무소</div>
      <div class="member-tags">

   <!-- 박진호 -->

  <div class="member-info">

<footer>
  <p><strong>BNI 자이언츠 챕터</strong><br>
  jinjjabg-hub.github.io/bni-giants</p>
</footer>

</body>
</html>
